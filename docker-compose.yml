# Local Postgres, to test the production database path on your machine:
#   docker compose up -d
#   DATABASE_URL="postgresql://lb:lb@localhost:5444/lestrebaldie" npm run db:setup
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lb
      POSTGRES_PASSWORD: lb
      POSTGRES_DB: lestrebaldie
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
